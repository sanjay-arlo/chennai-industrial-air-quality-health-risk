name: Build and deploy industry dashboard
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
jobs:
  build-and-deploy:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Generate or verify project dataset
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import csv,datetime
          from pathlib import Path
          p=Path('sample_zone_air_quality_chennai.csv')
          if not p.exists():
              z=['Manali','Ennore','Kodungaiyur','Central','South']; h=['date','zone','aqi','pm25_ugm3','pm10_ugm3','population']; s=datetime.date(2026,1,1)
              with p.open('w',newline='',encoding='utf-8') as f:
                  w=csv.writer(f); w.writerow(h)
                  for i in range(900):
                      a=70+(i%5)*12+(i*7)%42; w.writerow([(s+datetime.timedelta(days=i//5)).isoformat(),z[i%5],a,35+(i%5)*8+(i*11)%25,70+(i%5)*12+(i*13)%45,[130000,105000,90000,520000,410000][i%5]])
          PY
      - name: Build dashboard bundle
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dashboard
          curl -fsSL https://raw.githubusercontent.com/sanjay-arlo/chennai-water-security-tanker-allocation/main/dashboard/index.html -o dashboard/index.html
          curl -fsSL https://raw.githubusercontent.com/sanjay-arlo/chennai-water-security-tanker-allocation/main/dashboard/app.js -o dashboard/app.js
          cp sample_zone_air_quality_chennai.csv dashboard/data.csv
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add dashboard sample_zone_air_quality_chennai.csv
          if ! git diff --cached --quiet; then git commit -m 'feat: build industry dashboard and dataset [skip ci]'; git push; fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: {path: dashboard}
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
